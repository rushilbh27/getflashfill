<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FlashFill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #000000;
        --card-bg: #1c1c1e;
        --accent: #0a84ff;
        --success: #30d158;
        --text: #ffffff;
        --text-secondary: #8e8e93;
        --divider: #38383a;
        --radius: 14px;
      }

      * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

      body {
        margin: 0;
        padding: 0;
        width: 320px;
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      .container {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Header Style */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #0a84ff, #409fff);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
      }

      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      /* Section Management */
      .section { display: none; }
      .section.active { display: flex; flex-direction: column; gap: 16px; animation: slideUp 0.3s ease-out; }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Cards & Lists */
      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 16px;
        border: 1px solid var(--divider);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--success);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(48, 209, 88, 0.1);
        padding: 4px 10px;
        border-radius: 20px;
        align-self: flex-start;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background: var(--success);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--success);
      }

      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Inputs & Buttons */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        background: #2c2c2e;
        border: 1px solid #3a3a3c;
        color: #ffffff;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="password"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.2);
      }

      button {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.1);
      }

      button:active {
        transform: scale(0.98);
      }

      button.secondary {
        background: #2c2c2e;
        color: var(--accent);
        margin-top: 8px;
      }

      /* History List */
      .history-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      .history-item {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 1px solid var(--divider);
        transition: background 0.2s;
        cursor: pointer;
      }

      .history-item:hover {
        background: #2c2c2e;
      }

      .history-item .email {
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
      }

      .history-item .url {
        color: var(--text-secondary);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .history-item .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
      }

      .history-item .date {
        color: #636366;
        font-size: 11px;
      }

      .empty-state {
        padding: 30px 0;
        text-align: center;
        color: var(--text-secondary);
        font-style: italic;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
          </div>
          <h1>FlashFill</h1>
        </div>
      </header>

      <div id="setup-section" class="section">
        <div class="card">
          <h2 style="margin-bottom: 12px;">Configuration</h2>
          <div class="input-group">
            <input id="api-key-input" type="password" placeholder="RapidAPI Key" />
            <button id="save-key-btn">Get Started</button>
          </div>
        </div>
        <p style="font-size: 11px; color: var(--text-secondary); margin: 0 4px; line-height: 1.4;">
          FlashFill uses Privatix Temp Mail to protect your identity. Paste your API key to enable automation.
        </p>
      </div>

      <div id="active-section" class="section">
        <div class="status-badge">
          <div class="status-dot"></div>
          Secured by Privatix
        </div>
        
        <div class="history-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <h2>Recent Emails</h2>
        </div>

        <ul id="history-list" class="history-container"></ul>
        
        <button id="clear-session-btn" class="secondary">Reset Session</button>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
