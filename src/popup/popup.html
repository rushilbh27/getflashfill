<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlashFill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <!-- ═══ Header ═══ -->
  <div class="header">
    <div class="brand">
      <img src="../../icons/icon.png" width="22" height="22" alt="FlashFill Logo" />
      <h1>FlashFill</h1>
    </div>
    <div class="header-actions">
      <button id="new-identity-btn" class="btn btn-accent btn-sm" title="Generate new identity">
        <svg class="rotate-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        New
      </button>
    </div>
  </div>

  <!-- ═══ Setup Section (no API key) ═══ -->
  <div id="setup-section" class="section">
    <div class="card glass-card">
      <div class="card-header">
        <h2>Configuration</h2>
      </div>
      <div class="card-content">
        <p class="muted">Paste your Privatix API Key to get started.</p>
        <input id="api-key-input" class="input" type="password" placeholder="RapidAPI Key" />
        <button id="save-key-btn" class="btn btn-primary">Connect</button>
      </div>
    </div>
  </div>

  <!-- ═══ Active Section (has API key) ═══ -->
  <div id="active-section" class="section">
    <!-- Status Banner -->
    <div class="status-banner">
      <div class="status-dot"></div>
      <span>Autonomous Mode Active</span>
      <span id="identity-age" class="identity-age"></span>
    </div>

    <!-- Identity Card -->
    <div class="card glass-card">
      <div class="card-header">
        <h2>Burner Identity</h2>
      </div>
      <div class="card-content identity-grid">
        <div class="kv-row">
          <span class="kv-label">Email</span>
          <div class="kv-value-container">
            <span id="id-email" class="kv-value">—</span>
            <button class="btn-copy copy-btn" data-copy="email" title="Copy Email">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
        <div class="kv-row">
          <span class="kv-label">Password</span>
          <div class="kv-value-container">
            <span id="id-password" class="kv-value kv-masked">—</span>
            <button id="toggle-password-btn" class="btn-copy" title="Toggle visibility">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="btn-copy copy-btn" data-copy="password" title="Copy Password">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
        <div class="kv-row">
          <span class="kv-label">First Name</span>
          <div class="kv-value-container">
            <span id="id-firstname" class="kv-value">—</span>
            <button class="btn-copy copy-btn" data-copy="firstname" title="Copy">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
        <div class="kv-row">
          <span class="kv-label">Last Name</span>
          <div class="kv-value-container">
            <span id="id-lastname" class="kv-value">—</span>
            <button class="btn-copy copy-btn" data-copy="lastname" title="Copy">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
        <div class="kv-row">
          <span class="kv-label">Username</span>
          <div class="kv-value-container">
            <span id="id-username" class="kv-value">—</span>
            <button class="btn-copy copy-btn" data-copy="username" title="Copy">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
        <div class="kv-row">
          <span class="kv-label">Phone</span>
          <div class="kv-value-container">
            <span id="id-phone" class="kv-value">—</span>
            <button class="btn-copy copy-btn" data-copy="phone" title="Copy">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Inbox Card -->
    <div class="card glass-card">
      <div class="card-header inbox-header">
        <h2>Inbox</h2>
        <div class="inbox-header-actions">
          <div class="toggle-row" title="Auto-open verification link in background tab">
            <span class="toggle-label">Auto-verify</span>
            <button id="auto-verify-toggle" class="toggle-pill" aria-pressed="true">
              <span class="toggle-thumb"></span>
            </button>
          </div>
          <button id="refresh-inbox-btn" class="btn-copy" title="Refresh Inbox">
            <svg class="rotate-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
      <div id="inbox-list" class="inbox-list">
        <div class="inbox-empty">Loading messages...</div>
      </div>
    </div>
  </div>

  <!-- ═══ Message Detail Overlay ═══ -->
  <div id="message-view">
    <div class="message-header">
      <button id="back-to-inbox-btn" class="btn-back" title="Back">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h2>Message Details</h2>
    </div>
    <div class="message-meta">
      <div id="msg-subject" class="message-meta-subject">Subject</div>
      <div id="msg-from" class="message-meta-from">From: sender@example.com</div>
    </div>
    <div id="msg-body" class="message-content">
      <!-- Injected HTML Content -->
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
